# Only the private-repository handoff belongs here; workfiles owns work setup.
[bootstrap.packages]
"brew:glab" = { os = "macos" }

# Run after common dotfiles/tools/services are ready. Workfiles has its own
# ordered bootstrap, including service preparation before its LaunchAgents.
[bootstrap.hooks]
final = 'DOTFILES="{{ config_root }}" "{{ config_root }}/boot/workfiles.sh" git.perkbox.io adam.hall/workfiles "{{ env.HOME }}/pb/adam.hall/workfiles"'
