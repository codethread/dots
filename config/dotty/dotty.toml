# Dotty configuration file
# Manually created from hardcoded configuration
#
# This file controls dotty's symlink management behavior.
# You can customize paths, excludes, and project settings here.

[global]
# Global exclusion patterns applied to all projects
excludes = [
    "**/_?*/**",       # Files/folders starting with underscore
    "**/.gitignore",   # Git ignore files
    "**/README.md"     # README files
]

[[project]]
name = "home"
origin = "${DOTFILES}/home"
target = "~"

[[project]]
name = "config"
origin = "${DOTFILES}/config"
target = "~/.config"

[[project]]
name = "claude"
origin = "${DOTFILES}/claude"
target = "~/.claude"
excludes = ["**/settings.json", "**/settings.local.json"]
# excludes = ["**/agents/**"]

# Pi user config
[[project]]
name = "pi"
origin = "${DOTFILES}/pi"
target = "~/.pi"

[[project]]
name = "work_home"
origin = "~/pb/adam.hall/workfiles/home"
target = "~"

[[project]]
name = "deals"
origin = "~/pb/adam.hall/workfiles/home/pb/app/deals-light-ui/_git"
target = "~/pb/app/deals-light-ui/.git"
