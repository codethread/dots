# vim:ft=hyprlang

####################################
#    Rose Pine Moon palette
####################################

$base    = 0xff232136
$surface = 0xff2a273f
$overlay = 0xff393552
$muted   = 0xff6e6a86
$subtle  = 0xff908caa
$text    = 0xffe0def4
$love    = 0xffeb6f92
$gold    = 0xfff6c177
$rose    = 0xffea9a97
$pine    = 0xff3e8fb0
$foam    = 0xff9ccfd8
$iris    = 0xffc4a7e7

####################################
#    Monitor
####################################

monitor = eDP-1, preferred, 0x0, 1
monitor = HDMI-A-1, preferred, 0x0, 1, mirror, eDP-1

####################################
#    Autostart
####################################

exec-once = swaybg -c 232136                          # rose pine base as wallpaper
exec-once = waybar
exec-once = mako
exec-once = bash -lc 'if [[ "$(hostname)" == "homelab" ]]; then obsidian; fi'
exec-once = bash -lc 'if [[ "$(hostname)" == "homelab" ]]; then spotify; fi'

####################################
#    General
####################################

general {
    border_size          = 2
    col.active_border    = $iris
    col.inactive_border  = $overlay
    gaps_in              = 4
    gaps_out             = 8
    layout               = dwindle
    resize_on_border     = true
}

####################################
#    Appearance
####################################

decoration {
    rounding             = 8

    active_opacity       = 1.0
    inactive_opacity     = 0.92

    blur {
        enabled          = true
        size             = 6
        passes           = 2
        new_optimizations = true
    }

    shadow {
        enabled          = true
        range            = 12
        color            = 0x66000000
    }
}

animations {
    enabled = true

    bezier = instant, 0.0, 0.0, 1.0, 1.0

    animation = windows,     1, 1, instant
    animation = windowsOut,  1, 1, instant, popin 80%
    animation = fade,        1, 1, instant
    animation = workspaces,  0
}

####################################
#    Input
####################################

input {
    kb_layout    = gb          # change to us if needed
    kb_options   = ctrl:nocaps
    follow_mouse = 1

    touchpad {
        natural_scroll   = true
        tap-to-click     = true
    }
}

####################################
#    Layout
####################################

dwindle {
    preserve_split   = true
}

####################################
#    Keybindings
####################################

$mod = SUPER

# Terminal
bind = $mod,       Return,      exec, kitty

# Launcher
bind = $mod,       Space,       exec, rofi -show drun

# Window management
bind = $mod,       Q,           killactive
bind = $mod SHIFT, E,           exec, hyprctl dispatch exit

# Fullscreen
bind = $mod CTRL,  Space,       fullscreen

# Focus (vim-style) — mirrors cmd-ctrl-hjkl from AeroSpace
bind = $mod CTRL,  H,           movefocus, l
bind = $mod CTRL,  L,           movefocus, r
bind = $mod CTRL,  K,           movefocus, u
bind = $mod CTRL,  J,           movefocus, d

# Workspace switching — mirrors cmd-ctrl-[u/i/o/p/y/n/t/,] from AeroSpace
bind = $mod CTRL,  U,           workspace, name:primary
bind = $mod CTRL,  I,           workspace, name:alt
bind = $mod CTRL,  O,           workspace, name:social
bind = $mod CTRL,  P,           workspace, name:planner
bind = $mod CTRL,  Y,           workspace, name:figma
bind = $mod CTRL,  N,           workspace, name:other
bind = $mod CTRL,  T,           workspace, name:test
bind = $mod CTRL,  comma,       workspace, name:ide

# Back and forth — mirrors alt-tab from AeroSpace
bind = ALT,        Tab,         workspace, previous

# Screenshot: region / full screen / active window
bind = ,           Print,       exec, bash -c 'g="$(slurp)" || exit 0; mkdir -p "$HOME/recordings"; f="$HOME/recordings/$(date +%Y%m%d_%H%M%S%N).png"; grim -g "$g" "$f" && wl-copy < "$f"'
bind = SHIFT,      Print,       exec, bash -c 'mkdir -p "$HOME/recordings"; f="$HOME/recordings/$(date +%Y%m%d_%H%M%S%N).png"; grim "$f" && wl-copy < "$f"'
bind = CTRL,       Print,       exec, bash -c 'mkdir -p "$HOME/recordings"; f="$HOME/recordings/$(date +%Y%m%d_%H%M%S%N).png"; grim -g "$(hyprctl activewindow -j | jq -r '"'"'"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"'"'"')" "$f" && wl-copy < "$f"'

# Volume
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

####################################
#    Mode: move  (SUPER+CTRL+M)
####################################

bind = $mod CTRL,  M,           submap, move

submap = move

# Move window
bind = , H,        movewindow,  l
bind = , J,        movewindow,  d
bind = , K,        movewindow,  u
bind = , L,        movewindow,  r

# Resize — mirrors ctrl-hjkl from AeroSpace move mode
bind = CTRL, H,    resizeactive, -50 0
bind = CTRL, L,    resizeactive,  50 0
bind = CTRL, J,    resizeactive,  0  50
bind = CTRL, K,    resizeactive,  0 -50

# Move to workspace (follows focus) — mirrors move mode workspace keys
bind = , U,        movetoworkspace, name:primary
bind = , I,        movetoworkspace, name:alt
bind = , O,        movetoworkspace, name:social
bind = , P,        movetoworkspace, name:planner
bind = , Y,        movetoworkspace, name:figma
bind = , N,        movetoworkspace, name:other
bind = , T,        movetoworkspace, name:test
bind = , comma,    movetoworkspace, name:ide

bind = , escape,   submap, reset

submap = reset

####################################
#    Mode: service  (SUPER+CTRL+;)
####################################

bind = $mod CTRL,  semicolon,   submap, service

submap = service

bind = , escape,   submap, reset
bind = , R,        exec, hyprctl reload
bind = , R,        submap, reset
bind = , F,        togglefloating
bind = , F,        submap, reset

submap = reset

####################################
#    Window rules
####################################

windowrule = float on,                  match:class ^(1Password)$

# Browsers: Chrome/Brave/Chromium → alt (tiled), Firefox → test (floating)
windowrule = workspace name:alt silent,      match:class ^([Gg]oogle-chrome)$
windowrule = workspace name:alt silent,      match:class ^([Bb]rave-browser)$
windowrule = workspace name:alt silent,      match:class ^([Cc]hromium)$
windowrule = workspace name:test silent,     match:class ^(firefox)$
windowrule = float on,                       match:class ^(firefox)$

# Workspaces
windowrule = workspace name:primary silent,  match:class ^(kitty)$
windowrule = workspace name:ide silent,      match:class ^([Cc]ursor)$
windowrule = workspace name:other silent,    match:class ^([Ss]potify)$
windowrule = workspace name:planner silent,  match:class ^([Oo]bsidian)$
windowrule = workspace name:social silent,   match:class ^([Ss]lack)$
windowrule = workspace name:social silent,   match:class ^(whatsapp-for-linux)$
windowrule = workspace name:social silent,   match:class ^(com\.obsproject\.Studio|[Oo]bs)$
