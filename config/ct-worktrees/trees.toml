# Worktree project bootstrap hooks.
#
# `root` must match the canonical/root worktree path for the repo.
# `command` always runs under bash after the worktree/slot is ready.
#
# Environment variables available to the command:
#   WK_ROOT     canonical/root worktree path
#   WK_CREATED  created worktree path or allocated pool slot path

[[project]]
name = "deals ui bootstrap"
root = "~/work/app/deals-light-ui"
pool_size = 8
command = '''
printf '%s\n' 'worktree: running yarn install'
yarn install
printf '%s\n' 'worktree: notifying ready'
notif worktree wk "$WK_CREATED" ready
'''

[[project]]
name = "agents"
root = "~/dev/projects/agents"
command = '''
printf '%s\n' 'worktree: running pnpm install'
pnpm install
printf '%s\n' 'worktree: notifying ready'
notif worktree wk "$WK_CREATED" ready
'''
