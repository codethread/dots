# Post-create hooks for `wk add`.
#
# `root` must match the canonical/root worktree path for the repo.
# The command runs after the new worktree has been created.
#
# Environment variables available to the command:
#   WK_ROOT     canonical/root worktree path
#   WK_CREATED  newly created worktree path
#
# `shell` can be `bash` or `nu` and defaults to `bash`.
# When `wk add` is run from tmux, hooks run in a post-create window in the
# worktree session. Outside tmux, hooks run in the current shell after `cd`.
#
# Example:
[[post_create]]
name = "deals ui bootstrap"
root = "~/work/app/deals-light-ui"
shell = "bash"
command = '''
printf '%s\n' 'post-create: copying node_modules'
rsync -a --info=progress2 "$WK_ROOT/node_modules/" "$WK_CREATED/node_modules/"
printf '%s\n' 'post-create: running yarn install'
yarn install
printf '%s\n' 'post-create: notifying ready'
notif worktree wk "$WK_CREATED" ready
'''
