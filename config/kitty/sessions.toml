# KSM Config v1.0
# Migrated from sessions.json

[global]
version = "1.0"

[search]
dirs = [
  "~/PersonalConfigs",
  "~/workfiles",
  "~/.local/share/nvim/lazy/*",
  "~/.local/share/nvim/mason/packages/*",
]
vsc = ["~/dev", "~/work"]
cmd = []

[projects]
dots = "~/PersonalConfigs"
qmk = "~/dev/projects/qmk_firmware/keyboards/preonic/keymaps/codethread"
ct_nvim = "~/dev/projects/ct.nvim"
ksm = "~/dev/projects/ksm"
pomo = "~/dev/projects/pomo"
qmk_nvim = "~/dev/projects/qmk.nvim"
git_tools = "~/dev/projects/git-tools"
git_nudge = "~/dev/projects/git-nudge"
nuphy = "~/dev/projects/nuphy_firmware/keyboards/nuphy/halo75v2/ansi"
old_notes = "~/Library/Mobile Documents/com~apple~CloudDocs/Documents/Notes"
claude_plugins = "~/dev/learn/claude-plugins"
notes = "~/dev/projects/notes"
ziggles = "~/dev/learn/ziggles/simple"

[keys]
P1 = "dots"
P2 = "claude_plugins"
P3 = "ziggles"
P8 = "nuphy"
P9 = "qmk"
P0 = "notes"

[profiles.work.projects]
deals_ui  = "~/work/app/deals-light-ui"
fe_native = "~/work/app/fe-native"
fe_feat = "~/work/app/deals-light-ui__ct--vite"
fe_feat2 = "~/work/app/fe-review"

notes = "~/Library/CloudStorage/OneDrive-Vivup/_docs/notes"
advanced_budgets = "~/dev/projects/advanced-budgets"
flexi_points = "~/work/perkbox-services/flexi-points/flexi-points-app"
inspect_package = "~/work/libraries/inspect-my-package"
workfiles = "~/workfiles"
protobuf = "~/work/perkbox-services/protobuf"
karen = "~/dev/projects/claude-karen"
ai_files = "~/dev/projects/ai-tools"

[profiles.work.keys]
P1 = "dots"
P2 = "deals_ui"
P3 = "fe_feat"
P4 = "fe_feat2"
P5 = "fe_native"

P7 = "ai_files"
P8 = "workfiles"
P9 = "protobuf"
P0 = "notes"

[profiles.homelab.search]
dirs = [
  "~/PersonalConfigs",
  "~/.local/share/nvim/lazy/*",
  "~/.local/share/nvim/mason/packages/*",
  "~/dev/projects/notes"
]
vsc = ["~/dev"]

[profiles.homelab.projects]
notes = "~/dev/projects/notes"
claude_code_plugins = "~/dev/projects/claude-code-plugins"
cc_inspect = "~/dev/projects/cc-inspect"
cc_notify = "~/dev/projects/cc-notify"
claudet = "~/dev/projects/claudet"
agents = "~/dev/projects/agents"

[profiles.homelab.keys]
P1 = "dots"
P2 = "agents"
P3 = "claude_code_plugins"
P4 = "cc_notify"

P9 = "cc_inspect"
P0 = "notes"

# ============================================================================
# PROFILE SELECTION RULES
# ============================================================================
[auto_profile]

[[auto_profile.rules]]
hostname_regex = "^PB-.*"
profile = "work"

[[auto_profile.rules]]
env = { CT_USER = "work" }
profile = "work"

[[auto_profile.rules]]
hostname_regex = "^homelab$"
profile = "homelab"
