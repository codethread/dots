## blurb: All natural pine, faux fur and a bit of soho vibes for the classy minimalist

foreground               #3d3a5e
# background               #faf4ed
background               #fffdfb
selection_foreground     #3d3a5e
selection_background     #f2e9e1

cursor                   #cecacd
cursor_text_color        #3d3a5e

url_color                #907aa9

active_tab_foreground    #907aa9
active_tab_background    #fffdfb

inactive_tab_foreground  #9893a5
inactive_tab_background  #fffdfb
active_border_color      #286983
inactive_border_color    #dfdad9

dim_opacity 0.7
# If app picks foreground too close to background, override to normal foreground.
# Great for bad TUI contrast. Try 3-5.
text_fg_override_threshold 4.0


