# vim:fileencoding=utf-8:foldmethod=marker:foldlevel=0

#: environment {{{

# Keep kitty aligned with nix-darwin's GUI env because kitty bindings/kittens
# run in their own sh context instead of a login nushell instance.
env XDG_CONFIG_HOME=${HOME}/.config
env XDG_DATA_HOME=${HOME}/.local/share
env XDG_STATE_HOME=${HOME}/.local/state
env XDG_CACHE_HOME=${HOME}/.local/cache
env DOTFILES=${DOTFILES}
env EDITOR=nvim
env ZDOTDIR=${XDG_CONFIG_HOME}/zsh
env HISTFILE=${XDG_STATE_HOME}/bash/history
env VOLTA_HOME=${HOME}/.volta
env CARGO_HOME=${XDG_DATA_HOME}/cargo
env CARGO_BIN=${CARGO_HOME}/bin
env CODEX_HOME=${XDG_CONFIG_HOME}/codex
env PATH=${HOME}/.local/bin:${CARGO_BIN}:${VOLTA_HOME}/bin:${HOME}/.bun/bin:/etc/profiles/per-user/${USER}/bin:/run/current-system/sw/bin:/nix/var/nix/profiles/default/bin:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:${PATH}

exe_search_path ~/.config/kitty/bin

#: }}}
#: shell & editor {{{

shell nu --login --interactive
editor nvim

#: }}}
#: appearance {{{

background_opacity 0.85

#: }}}
#: status bar {{{

tab_bar_min_tabs 1
tab_bar_edge  top
tab_bar_style custom
active_tab_font_style bold
# only show current session tabs (tmux style)
tab_bar_filter session:~

#: }}}
#: keys {{{

include ./keys.${KITTY_OS}.conf

#: }}}
#: fonts {{{

# https://helpx.adobe.com/fonts/using/open-type-syntax.html for features
#
# To get a full list of supported fonts use the `kitty +list-fonts` command.
# also `kitty +list-fonts --psnames`
# easier: `kitten choose-fonts`

font_size          14.0
modify_font cell_height 130%

modify_font underline_position 1

# https://rubjo.github.io/victor-mono/
font_family      family="Victor Mono" features='salt=2 cv01=1 cv02=1 cv06=1 cv14=1 +zero +onum +ss04 cv18=1 cv30=1 +ss09 +ss07'
# font_family      family="Lilex" features='salt=2 cv01=1 cv02=1 cv06=1 cv14=1 +zero +onum +ss04 cv18=1 cv30=1 +ss09 +ss07'
bold_font        auto
italic_font      auto
bold_italic_font auto

#: }}}
#: remote control & integration {{{

allow_remote_control yes
listen_on unix:/tmp/mykitty
shell_integration enabled
# ksm integration
# shell_integration no-title

# startup_session ./sessions/dots.session
# watcher watchers/sessions.py

#: }}}
#: window & layout {{{

# this tends to be problematic on monitor change
# remember_window_position yes
dynamic_background_opacity true
window_padding_width 3
placement_strategy center
hide_window_decorations titlebar-only
# macos_* directives are silently ignored by kitty on Linux
macos_show_window_title_in none
confirm_os_window_close -1
macos_option_as_alt yes
cursor_trail 1
# notifications are disabled until specs/kitty-notifications.md is implemented
# notify_on_cmd_finish invisible 10
# Dynamic layouts based on display scale and size
geninclude geninclude_config.py
visual_window_select_characters ajkl;sdfuiopqwer

#: }}}
#: clipboard & mouse {{{

clipboard_control write-clipboard write-primary no-append
mouse_hide_wait 0.1
copy_on_select clipboard
# remove trailing spaces
strip_trailing_spaces smart

#: }}}
#: scrollback {{{

scrollback_pager_history_size 2
scrollback_fill_enlarged_window yes
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 3.0
scrollback_pager_history_size 1

#: }}}
#: theme {{{


include themes/active.conf

#: }}}
map shift+enter send_text all \e\r
