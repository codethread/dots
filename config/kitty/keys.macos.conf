# vim:fileencoding=utf-8:foldmethod=marker:foldlevel=0
# Kitty terminal-level bindings only. Tmux owns multiplexing/session behavior.

#: system {{{

kitty_mod ctrl+shift
map cmd+enter toggle_fullscreen
map ctrl+tab no_op
map ctrl+shift+tab no_op

# keep macOS/Linux style clipboard bindings
map super+c copy_to_clipboard
map super+v paste_from_clipboard

# pass macOS tab-cycle muscle memory through to tmux previous/next window.
# Bind both physical bracket keys and shifted brace forms: keyboard layouts differ,
# and kitty debug-input reports Cmd+Shift+[/] as shift+super bracket key events.
map super+[ send_key ctrl+alt+z
map super+] send_key ctrl+alt+x
map shift+super+[ send_key ctrl+alt+z
map shift+super+] send_key ctrl+alt+x
map super+{ send_key ctrl+alt+z
map super+} send_key ctrl+alt+x

# lightweight terminal action menu: opacity, reload, debugging, key inspection
map f1 launch --type=overlay menu.sh

#: }}}
#: app compatibility {{{

# Used by agent/TUI tools that distinguish shifted enter.
map shift+enter send_text all \x1b[13;2u
map alt+enter send_text all \x1b[13;3u

#: }}}
#: scrollback {{{

# open pane history in nvim via kitty+page renderer
map f2 show_scrollback

#: }}}
