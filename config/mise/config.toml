min_version = "2026.9.15"

# Global CLI defaults, linked by dotty. The project loads this same file through
# .mise/conf.d/tools.toml, so tools are also available before the first link.
# Keep service/bootstrap tasks project-local: they must not run in other repos.
[tools]
node = "24"
# Preserve the Nix JDK's Java 21 major; projects can select their own vendor/version.
java = "temurin-21"
clj-kondo = "latest"
bun = "1.4.2"
go = "1.26"
zig = "latest"
deno = "latest"
pnpm = "latest"
python = "3.11"
uv = "latest"
rust = "stable"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
# No upstream release binary/formula; retain the revision previously in flake.lock.
"cargo:https://github.com/nushell/nufmt" = "rev:24023665d1c2661addb22dce384b53d4a839727f"

# Devflow's terminal DAG renderer. Pure Perl: no build or CPAN dependencies needed.
# Keep the same release and checksum as the former Nix derivation.
[tools."http:graph-easy"]
version = "0.76"
os = ["macos"]
url = "https://cpan.metacpan.org/authors/id/S/SH/SHLOMIF/Graph-Easy-0.76.tar.gz"
checksum = "sha256:d4a2c10aebef663b598ea37f3aa3e3b752acf1fbbb961232c3dbe1155008d1fa"
strip_components = 1
bin_path = "bin"
postinstall = '''
set -eu
mv "$MISE_TOOL_INSTALL_PATH/bin/graph-easy" "$MISE_TOOL_INSTALL_PATH/graph-easy.pl"
cat > "$MISE_TOOL_INSTALL_PATH/bin/graph-easy" <<'SH'
#!/bin/bash
set -euo pipefail
root="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")/.." && pwd)"
exec /usr/bin/perl -I "$root/lib" "$root/graph-easy.pl" "$@"
SH
chmod +x "$MISE_TOOL_INSTALL_PATH/bin/graph-easy"
'''
