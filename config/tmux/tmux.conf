# vim:foldmethod=marker:foldlevel=0

#: envs {{{

# NixOS: graphical sessions don't inherit sessionPath, so ~/.local/bin is
# missing from run-shell PATH. Prepend it so keybindings can find scripts.
run-shell 'tmux set-environment -g PATH "$HOME/.local/bin:$PATH"'
set -ga update-environment SSH_TTY

%hidden IS_HOME="#{==:#{user},codethread}"
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?)(diff)?$"'

#: }}}
#: global {{{

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g aggressive-resize on
set -g automatic-rename on
set -g base-index 1
set -g detach-on-destroy off
set -g history-limit 5000
set -g main-pane-width 60%
set -g mouse on
set -g pane-base-index 1
set -g prefix C-a
set -g remain-on-exit off
set -g renumber-windows on
set -g set-titles on
set -g visual-activity off
set -g visual-bell off
set -g visual-silence on
set -g set-clipboard on
set -s escape-time 10
set -g extended-keys on # added for pi for shift/alt+enter
set -g extended-keys-format csi-u # added for pi
set -g allow-passthrough on

#: }}}
#: bindings {{{

unbind C-b
bind-key C-a send-prefix

# Fast reload skips TPM/plugin init; plugin init is the reload bottleneck.
# Use C-a C-r when plugin declarations/options need to be re-sourced.
bind-key r set -g @ct_fast_reload 1 \; source-file ~/.config/tmux/tmux.conf \; set -gu @ct_fast_reload \; display "Config reloaded"
bind-key C-r source-file ~/.config/tmux/tmux.conf \; display "Config + plugins reloaded"
# C-a Shift+R = rename window
bind-key R command-prompt -p "Rename Window:" "rename-window '%%'"

bind-key C-M run-shell 'nu -c "use ct/tmux; tmux notes"'
bind-key ? run-shell -b "tmuxKeys"
bind-key s choose-tree -s
bind-key P run-shell '~/.local/bin/pdx-pandora'
bind-key T run-shell '~/.local/bin/tmux-agent-switch'
bind-key t run-shell '~/.local/bin/tmux-agent-switch'

set -g @plugin 'sainnhe/tmux-fzf'
set-environment -g TMUX_FZF_LAUNCH_KEY "\\;"
set-environment -g TMUX_FZF_PANE_FORMAT "#{window_index}.#{pane_index} #{?window_active,+,}#{window_name} - #{pane_current_command} #{pane_current_path}"

#: }}}
#: vim / copy mode {{{

set -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# C-a [ = copy mode / scrollback
bind-key [ copy-mode

# move up/down through prompts in copy mode
bind-key -n M-[ {
	copy-mode -H
	send-keys -X previous-prompt
}
bind-key -T copy-mode-vi -r M-[ {
	send-keys -X previous-prompt
}
bind-key -n M-] {
	copy-mode -H
	send-keys -X next-prompt
}
bind-key -T copy-mode-vi -r M-] {
	send-keys -X next-prompt
}

#: }}}
#: session {{{

# C-a p = switch project/session
bind-key p run-shell 'nu -c "use ct/tmux; tmux switch"'
# C-a f = project/session picker
bind-key f run-shell 'tmux-session'
# C-a g = fuzzy-pick git worktree in current repo
bind-key g run-shell 'cd "#{pane_current_path}" && nu -c "use ct/git/worktree *; wk switch"'

# C-a 0-9 = switch tmux session from sessions.toml
bind-key 0 run-shell 'tmux-session 0'
bind-key 1 run-shell 'tmux-session 1'
bind-key 2 run-shell 'tmux-session 2'
bind-key 3 run-shell 'tmux-session 3'
bind-key 4 run-shell 'tmux-session 4'
bind-key 5 run-shell 'tmux-session 5'
bind-key 6 run-shell 'tmux-session 6'
bind-key 7 run-shell 'tmux-session 7'
bind-key 8 run-shell 'tmux-session 8'
bind-key 9 run-shell 'tmux-session 9'

# C-a N = new session
bind-key N command-prompt -p "New Session:" "new-session -s '%%' -n main"

# C-a Tab = last session
bind-key -r Tab switch-client -l

bind-key w run-shell 'nu -l -c "work-start-work"'
bind-key W run-shell 'nu -l -c "work-start-native"'

# C-a Shift+Backspace = close session
bind-key S-BSpace kill-session

# C-a h = enter slot-assign mode
# Numbered slots are seeded from sessions.toml on first use, then mutable.
#   C-a h 0-9   Assign current session to that slot
#   C-a h a     Append current session to state file
#   C-a h e     Edit state file
#   C-a h l     List slots via fzf and jump
#   C-a h r     Reseed slots from sessions.toml

bind-key h switch-client -T harpoon
bind-key -T harpoon 1 run 'tmux-session --assign 1'
bind-key -T harpoon 2 run 'tmux-session --assign 2'
bind-key -T harpoon 3 run 'tmux-session --assign 3'
bind-key -T harpoon 4 run 'tmux-session --assign 4'
bind-key -T harpoon 5 run 'tmux-session --assign 5'
bind-key -T harpoon 6 run 'tmux-session --assign 6'
bind-key -T harpoon 7 run 'tmux-session --assign 7'
bind-key -T harpoon 8 run 'tmux-session --assign 8'
bind-key -T harpoon 9 run 'tmux-session --assign 9'
bind-key -T harpoon 0 run 'tmux-session --assign 0'
bind-key -T harpoon a run 'tmux-session --add'
bind-key -T harpoon e run 'tmux-session --edit'
bind-key -T harpoon l run 'tmux-session --list'
bind-key -T harpoon r run 'tmux-session --seed'
bind-key -T harpoon q switch-client -T root
bind-key -T harpoon Escape switch-client -T root
bind-key -T harpoon C-c switch-client -T root

#: }}}
#: window {{{

# C-a n = new window with cwd
bind-key n new-window -c "#{pane_current_path}"

# window list via fzf
bind-key "'" run-shell -b "~/.config/tmux/plugins/tmux-fzf/scripts/window.sh switch"

bind-key -n C-M-z previous-window
bind-key -n C-M-x next-window
bind-key -n C-M-Left swap-window -t -1\; select-window -t -1
bind-key -n C-M-Right swap-window -t +1\; select-window -t +1
# C-a BTab = last window
bind-key -r BTab last-window
# C-a Backspace = kill window
bind-key BSpace kill-window

# C-a o = kill other windows
bind-key o kill-window -a

#: }}}
#: layout {{{

# C-a = forces tall; C-a Enter toggles tall/fat with client-size-aware bias.
bind-key = run-shell 'tmux-layout-aware tall'
bind-key Enter run-shell 'tmux-layout-aware toggle'

#: }}}
#: pane {{{

# C-a Space = zoom or split
bind-key Space if -F "#{==:#{window_panes},1}" {
	split-window -h -c "#{pane_current_path}"
	select-layout main-vertical
} {
	resize-pane -Z
}

# Smart pane navigation/resizing with Neovim split awareness.
# `smart-splits.nvim` sets pane-local `@pane-is-vim`; the TPM plugin binds
# C-h/j/k/l and M-h/j/k/l to either Neovim or tmux panes as appropriate.
set -g @plugin 'mrjones2014/smart-splits.nvim'
set -g @smart-splits_move_left_key  'C-h'
set -g @smart-splits_move_down_key  'C-j'
set -g @smart-splits_move_up_key    'C-k'
set -g @smart-splits_move_right_key 'C-l'
set -g @smart-splits_resize_left_key  'M-h'
set -g @smart-splits_resize_down_key  'M-j'
set -g @smart-splits_resize_up_key    'M-k'
set -g @smart-splits_resize_right_key 'M-l'
set -g @smart-splits_resize_step_size '3'

# C-a H/J/K/L = resize panes
bind-key -r H resize-pane -L 2
bind-key -r J resize-pane -D 2
bind-key -r K resize-pane -U 2
bind-key -r L resize-pane -R 2

# C-a | and C-a - = splits
unbind '"'
unbind %
bind-key -r - split-window -c "#{pane_current_path}"
bind-key -r | split-window -h -c "#{pane_current_path}"

# C-a } / { = move pane forward/backward
bind-key '}' swap-pane -D
bind-key '{' swap-pane -U

# C-a m = move pane to top
bind-key m swap-pane -t 1

# C-a x = close pane (tmux default, explicit for clarity)
bind-key x kill-pane

# join another pane via fzf
bind-key j run-shell -b "~/.config/tmux/plugins/tmux-fzf/scripts/pane.sh swap"
# dismiss current pane to background
bind-key b break-pane -d

bind-key S command-prompt -p 'save history to filename:' -I '~/tmux.history' 'capture-pane -S -; save-buffer %1 ; delete-buffer'
bind-key O run-shell -b "tmuxBuffer"

#: }}}
#: fingers {{{

set -g @plugin 'Morantron/tmux-fingers'

set -g @fingers-show-copied-notification 0
set -g @fingers-skip-wizard 1
set -g @fingers-highlight-style "fg=yellow"
set -g @fingers-hint-style "fg=red,bold"
set -g @fingers-backdrop-style "fg=white,dim"
set -g @fingers-hint-position "right"

# vimgrep patterns
set -g @fingers-pattern-0 "(([.\\w\\-~\\$@]+)?(/[.\\w\\-@]+)+/?(:\\d+)?(:\\d+)?)"

# C-a l = fingers/open selection
bind-key l if-shell "$is_vim" {
	run -b 'nu -c "use ct/tmux; tmux finger-other-pane"'
} {
	run -b "#{@fingers-cli} start #{pane_id}"
}

#: }}}
#: ui {{{

# Use tmux's own terminfo inside panes. The outer terminal may be kitty
# (`TERM=xterm-kitty`), but child processes inside tmux should see a terminfo
# entry available from nix/ncurses to avoid activation scripts failing.
set -g default-terminal "tmux-256color"

set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours

# modes
set -g clock-mode-colour colour135
set -g mode-style fg=cyan,bg=black,bold

# panes
set -g pane-border-style bg="default",fg="#686868"
set -g pane-active-border-style bg="default",fg="blue"

#: }}}
#: status line {{{

set -g status-interval 2
set -g status-justify left
set -g status-position top
set -g status-style bg="default",fg="white"
set -g status-right-length 100
set -g status-left-length 100

set -g status-left '#[fg=magenta,bg=default,bold]#{?client_prefix,#[fg=violet],} #S#[fg=normal,bg=default] '

%if $IS_HOME
set -g status-right '#(tmux-sysstat #{client_pid})'
%else
set -g status-right ''
%endif

set -g window-status-current-format "#[fg=magenta, bold] #W#{?window_zoomed_flag,#[bold]+,}"
set -g window-status-format "#[fg=normal] #W#{?window_zoomed_flag,#[bold]+,}"

set -g window-status-bell-style fg=colour255,bg=colour1,bold

set -g message-command-style fg=magenta,bg=default
set -g message-style fg="magenta",bg="default",bold

#: }}}

#: hooks {{{

if-shell 'test -f ~/.claude/plugins/data/cc-notify-cc-notify-marketplace/tmux-focus.js' \
  "set-hook -g pane-focus-in 'run-shell ~/.claude/plugins/data/cc-notify-cc-notify-marketplace/tmux-focus.js'"

#: }}}
#: plugins {{{

set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TMUX plugin manager (keep at very bottom).
# TPM re-runs every plugin's *.tmux file and tmux-fingers is slow, so normal
# config reloads set @ct_fast_reload=1 to skip this block.
if -F "#{!=:#{@ct_fast_reload},1}" {
	if "test ! -d ~/.config/tmux/plugins/tpm" \
		"run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
	run '~/.config/tmux/plugins/tpm/tpm'
}

#: }}}

