min_version = "2026.10.4"

[settings]
dotfiles.root = "."

# Large shared declarations live in .mise/conf.d/{packages,repos,dotfiles,macos}.toml.
# Machine differences live in mise.<profile>.toml and profile-specific fragments.
[vars]
git_maintenance_repositories = ""
botlake_ui_enabled = "false"
claude_enable_notify = false
syncengine_path = "{{ env.HOME }}/.local/bin:/opt/homebrew/opt/coreutils/libexec/gnubin:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin"

# Tapped cask metadata evaluation requires Ruby 3+.
[tools]
ruby = "4.0"

# Native bootstrap owns convergence. Hooks handle prerequisites and repo setup.
[bootstrap.hooks]
# Cask status checks need Ruby, and PAM safety must be validated before files.
# Install the remaining tools after built-in packages but before repositories,
# dependency preparation, dotfiles, and raw LaunchAgents.
pre-packages = [
  "mise install ruby",
  '"{{ config_root }}/boot/check-system.sh" --pre-packages',
]
# Let Homebrew resolve Botlake's cross-tap Bun dependency. Mise 2026.10.4's
# native resolver incorrectly reuses Botlake's custom tap URL for that dependency.
# This is the sole Botlake package installer, not a fallback; upgrades are explicit.
pre-repos = '''
set -eu
mise install
/opt/homebrew/bin/brew tap codethread/botlake https://github.com/codethread/botlake
HOMEBREW_NO_INSTALL_UPGRADE=1 /opt/homebrew/bin/brew install codethread/botlake/botlake
'''
post-repos = '''
DOTFILES="{{ config_root }}" \
GIT_MAINTENANCE_REPOSITORIES="{{ vars.git_maintenance_repositories }}" \
SYNCENGINE_PATH="{{ vars.syncengine_path }}" \
BOTLAKE_UI_ENABLED="{{ vars.botlake_ui_enabled }}" \
mise exec -- "{{ config_root }}/boot/setup.sh"
'''
# The cask only links the CLI; first use installs skills unless declined.
# v0.15.5+ honors this choice across upgrades. SKIP_SETUP only affects curl installs.
# https://github.com/zenbu-labs/terminal-browser/blob/v0.15.5/cli/src/setup.ts
post-packages = '''
set -eu
state="${XDG_STATE_HOME:-$HOME/.local/state}/terminal-browser"
mkdir -p "$state"
printf 'no\n' > "$state/skills-choice"
# Unlink only this tool's skills, including dangling links; never recursively delete.
rm -f \
  "${AGENT_SKILLS_HOME:-$HOME/.agents/skills}/terminal-browser" \
  "$HOME/.claude/skills/terminal-browser" \
  "$HOME/.codex/skills/terminal-browser" \
  "$HOME/.cursor/skills/terminal-browser" \
  "$HOME/.gemini/skills/terminal-browser" \
  "$state/skills.links"
'''

# Start after native LaunchAgents load; warn and skip externally owned Botlake.
post-tools = '"{{ config_root }}/boot/start-botlake.sh"'

# Native bootstrap owns preview/status/update; tasks cover repo-specific workflows.
[tasks.default]
description = "Apply full workstation setup"
depends = ["install"]
run = "mise bootstrap --yes"

[tasks.update]
description = "Update repositories and apply full workstation setup"
depends = ["install"]
run = "mise bootstrap --update"

[tasks.install]
description = "Install locked repository workspace dependencies"
dir = "{{ config_root }}"
run = "bun install --frozen-lockfile"

[tasks.link]
description = "Apply repository-managed symlinks and global agent instructions"
run = '''
mise dot apply \
  "$HOME" \
  "$HOME/.config" \
  "$HOME/.claude" \
  "$HOME/.pi" \
  "$HOME/.claude/skills" \
  "$HOME/.claude/CLAUDE.md" \
  "$HOME/.config/codex/AGENTS.md" \
  "$HOME/.pi/agent/APPEND_SYSTEM.md" \
  "$HOME/.local/bin/pi" \
  "$HOME/.local/bin/gitwatch" \
  "$HOME/.local/bin/bra" \
  "$HOME/.local/bin/cc-hook--context-injector" \
  "$HOME/.local/bin/cc-hook--npm-redirect" \
  "$HOME/.local/bin/cc-statusline" \
  "$HOME/.local/bin/cindex" \
  "$HOME/.local/bin/ghub" \
  "$HOME/.local/bin/git-cleanup" \
  "$HOME/.local/bin/git-pipeline--await" \
  "$HOME/.local/bin/gitlab-pipeline-watcher" \
  "$HOME/.local/bin/mise-dot-diff" \
  "$HOME/.local/bin/notif" \
  "$HOME/.local/bin/prepend-comment" \
  "$HOME/.local/bin/strip-markdown" \
  "$HOME/.local/bin/theme" \
  "$HOME/.local/bin/tts"
'''

[tasks."setup:repo"]
description = "Prepare this checkout without applying host configuration"
run = '''
bun install --frozen-lockfile
git config core.hooksPath .githooks
bun run changelog:check
'''

[tasks.build]
description = "Install and verify Oven, repository setup, and lake configuration"
dir = "{{ config_root }}/oven"
run = "mise run verify"

[tasks."test:nvim-smoke"]
description = "Run the isolated Neovim configuration smoke"
shell = "bash -c"
run = '''
set -euo pipefail
root="{{ config_root }}"
state="$(mktemp -d "${TMPDIR:-/tmp}/dots-nvim-smoke.XXXXXX")"
trap 'rm -rf "$state"' EXIT

mkdir -p "$state"/{home,cache,config,data,state,tmp,deps/mini.nvim/lua/mini}
curl -fsSL \
  https://raw.githubusercontent.com/nvim-mini/mini.test/0d0c3257cf799a6a1869fdb4bdda8f330bb63e03/lua/mini/test.lua \
  -o "$state/deps/mini.nvim/lua/mini/test.lua"
printf '%s  %s\n' \
  afc2dc8d38a9f061325c1f57bd5451154d3c5ed29ca777216a09c4e467c7466a \
  "$state/deps/mini.nvim/lua/mini/test.lua" | shasum -a 256 -c -

env -i \
  HOME="$state/home" \
  PATH="$PATH" \
  TMPDIR="$state/tmp" \
  XDG_CACHE_HOME="$state/cache" \
  XDG_CONFIG_HOME="$state/config" \
  XDG_DATA_HOME="$state/data" \
  XDG_STATE_HOME="$state/state" \
  NVIM_LOG_FILE="$state/nvim.log" \
  NVIM_SMOKE_CONFIG="$root/config/nvim" \
  NVIM_SMOKE_DEP="$state/deps/mini.nvim" \
  NVIM_SMOKE_TEST="$root/tests/nvim/test_config_smoke.lua" \
  nvim --headless --noplugin -u "$root/tests/nvim/minimal_init.lua" \
    -c 'lua MiniTest.run()'
'''

# Explicit maintenance only; never run cleanup as part of bootstrap.
[tasks."brew:cleanup"]
description = "Remove old Homebrew versions and stale downloads without autoremove (preview with --dry-run)"
env.HOMEBREW_NO_AUTOREMOVE = "1"
run = "brew cleanup"

[tasks."llm:update"]
description = "Update Claude, Codex, Pi, Pi-Bolt, and their extensions"
env.DOTFILES = "{{ config_root }}"
run = '"{{ config_root }}/home/.local/bin/mise-llm" update'

# These templates read the shared agent instructions relative to this file.
[dotfiles."~/.claude/CLAUDE.md"]
source = "templates/agents/claude.md.tera"
mode = "template"

[dotfiles."~/.config/codex/AGENTS.md"]
source = "templates/agents/codex.md.tera"
mode = "template"

[dotfiles."~/.pi/agent/APPEND_SYSTEM.md"]
source = "templates/agents/pi.md.tera"
mode = "template"

# Workstation setup.
[bootstrap.directories]
"~/dev/vendor" = {}
"~/dev/learn" = {}
"~/dev/projects" = {}
"~/.local/cache/docs" = {}
"~/.local/bin" = {}
"/tmp/claude" = { mode = "1777" }

# Apple-supported sudo extension point (macOS 14+). Leave /etc/pam.d/sudo alone.
# https://support.apple.com/en-us/109030
# https://github.com/fabianishere/pam_reattach
[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.files."/etc/pam.d/sudo_local"]
owner = "root"
group = "wheel"
mode = "0644"
# Do not replace symlinks owned by another configuration manager.
content = '''
# Managed by dots/mise; optional reattach enables Touch ID inside tmux/screen.
auth       optional       /opt/homebrew/lib/pam/pam_reattach.so
auth       sufficient     pam_tid.so
'''

# Refresh independently of tmux. Pitchfork serializes scheduled runs.
[daemons.codex-usage]
# The login baseline supplies PATH and CODEX_HOME.
run = '. "$HOME/dev/dots/config/env/base.sh" && exec home/.local/bin/codex-usage-refresh'
# Pitchfork cron includes seconds: run at second zero of every minute.
cron = "0 * * * * *"
oneshot = true
boot_start = true
retry = false

# Homebrew owns both CLIs; Pitchfork alone owns supervision (not brew services).
# Use the stable opt path, including in children; each lake still pins its Core.
[daemons.botlake-supervisor]
# Load the login baseline (including ~/.privates.sh): lakes and their agents inherit this environment.
run = '. "$HOME/dev/dots/config/env/base.sh" && export PATH="/opt/homebrew/opt/botlake/bin:$PATH"; exec /opt/homebrew/opt/botlake/bin/botlake start'
ready_cmd = '/opt/homebrew/opt/botlake/bin/botlake status'
retry = true
boot_start = true
