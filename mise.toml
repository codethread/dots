min_version = "2026.9.15"

# Shared bootstrap resources live here; machine differences live in mise.<profile>.toml.
# .mise/conf.d/ only reuses global tools and dev/work services.
[vars]
vscode_extensions = "cunbidun.flash-vscode haphazarddev.oil-code vscodevim.vim dbaeumer.vscode-eslint esbenp.prettier-vscode biomejs.biome davidsanders.search-under-cursor usernamehw.commands wraith13.unsaved-files-vscode formulahendry.auto-close-tag formulahendry.auto-rename-tag mvllow.rose-pine jgclark.vscode-todo-highlight kamikillerto.vscode-colorize rust-lang.rust-analyzer bradlc.vscode-tailwindcss ms-playwright.playwright"
git_maintenance_repositories = ""
claude_enable_notify = false
syncengine_path = "{{ env.HOME }}/.local/bin:/opt/homebrew/opt/coreutils/libexec/gnubin:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin"

# Native bootstrap owns convergence. Hooks handle only repo-specific setup.
[bootstrap.hooks]
# Raw LaunchAgents load before mise's normal tools phase, so install tools early.
post-packages = ["mise install", '"{{ config_root }}/boot/check-system.sh"']
post-repos = '''
DOTFILES="{{ config_root }}" \
DOTS_VSCODE_EXTENSIONS="{{ vars.vscode_extensions }}" \
GIT_MAINTENANCE_REPOSITORIES="{{ vars.git_maintenance_repositories }}" \
SYNCENGINE_PATH="{{ vars.syncengine_path }}" \
mise exec -- "{{ config_root }}/boot/setup.sh"
'''

# Defaults values are literal; use the hook for the user's screenshot path.
post-defaults = """
set -e
/usr/bin/defaults write com.apple.screencapture location "$HOME/Pictures"
/usr/bin/killall SystemUIServer >/dev/null 2>&1 || true
/usr/bin/killall Finder >/dev/null 2>&1 || true
/usr/bin/killall Dock >/dev/null 2>&1 || true
"""

[tasks."llm:update"]
description = "Update Claude, Cursor Agent, Codex, Pi, and Pi npm extensions"
env.DOTFILES = "{{ config_root }}"
run = '"{{ config_root }}/home/.local/bin/mise-llm" update'

