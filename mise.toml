# Workstation setup.
[bootstrap.directories]
"~/dev/vendor" = {}
"~/dev/learn" = {}
"~/dev/projects" = {}
"~/.local/cache/docs" = {}
"~/.local/bin" = {}
"/tmp/claude" = { mode = "1777" }

[bootstrap.repos]
"~/dev/vendor/nu_scripts" = { url = "https://github.com/nushell/nu_scripts.git" }
"~/dev/vendor/gitwatch" = { url = "https://github.com/gitwatch/gitwatch.git" }
"~/sync/Alfred" = { url = "git@github.com:codethread/alfred.git" }
"~/sync/images" = { url = "git@github.com:codethread/images.git" }
# Pi's repo-owned settings already load this checkout as a local package.
"~/dev/projects/agents" = { url = "git@github.com:codethread/agents.git" }
"~/dev/projects/hive" = { url = "git@github.com:codethread/hive.git" }

# Preserve the API-compatible codethread fork, not Homebrew's upstream CLI.
[bootstrap.repos."~/dev/vendor/todoist"]
url = "https://github.com/codethread/todoist.git"
ref = "5d1c6df1a86729b193840d988fb38fa654b93bb9"

[dotfiles."~/.local/bin/gitwatch"]
source = "~/dev/vendor/gitwatch/gitwatch.sh"
mode = "symlink"

[dotfiles."~/.claude/settings.json"]
source = "templates/claude-settings.json.tera"
mode = "template"

# Apple-supported sudo extension point (macOS 14+). Leave /etc/pam.d/sudo alone.
# https://support.apple.com/en-us/109030
# https://github.com/fabianishere/pam_reattach
[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.files."/etc/pam.d/sudo_local"]
owner = "root"
group = "wheel"
mode = "0644"
# Do not replace symlinks owned by another configuration manager.
content = '''
# Managed by dots/mise; optional reattach enables Touch ID inside tmux/screen.
auth       optional       /opt/homebrew/lib/pam/pam_reattach.so
auth       sufficient     pam_tid.so
'''

# Shared user macOS preferences.
[bootstrap.macos.dock]
autohide = true
mru_spaces = false
orientation = "left"
tilesize = 50

[bootstrap.macos.finder]
preferred_view_style = "list"
show_all_files = true
show_extensions_warning = false
show_status_bar = true
sort_folders_first = true

[bootstrap.macos.keyboard]
initial_key_repeat = 12
key_repeat = 2
press_and_hold = false

[bootstrap.macos.defaults.NSGlobalDomain]
AppleShowAllExtensions = true
AppleShowScrollBars = "WhenScrolling"
NSAutomaticWindowAnimationsEnabled = false
NSNavPanelExpandedStateForSaveMode = true

[bootstrap.macos.defaults."com.apple.dock"]
"expose-animation-duration" = 0.0
"expose-group-apps" = true
"static-only" = true

[bootstrap.macos.defaults."com.apple.finder"]
FXDefaultSearchScope = "SCcf"
ShowExternalHardDrivesOnDesktop = true
ShowHardDrivesOnDesktop = false
ShowRecentTags = false
ShowRemovableMediaOnDesktop = true
"_FXShowPosixPathInTitle" = false

[bootstrap.macos.defaults."com.apple.spaces"]
"spans-displays" = false

[bootstrap.macos.defaults."com.apple.universalaccess"]
reduceMotion = true

# Shared all-profile syncengine service.
[bootstrap.directories."~/.local/state/com.codethread.syncengine"]

[bootstrap.macos.launchd.agents.syncengine]
program = "/bin/bash"
args = ["-c", '''
echo "Starting sync"

directory="$HOME/sync"

LOGDIR="$HOME/.local/state/com.codethread.syncengine"
mkdir -p "$LOGDIR"
mkdir -p "$directory"

# An empty sync directory has no watchers.
shopt -s nullglob
for file in "$directory"/*; do
  logfile="$LOGDIR/${file##*/}.log"
  gitwatch -r origin -R "$file" >"$logfile" 2>&1 &
  echo "Running syncengine on $file and logging to $logfile"
done

file="$HOME/Library/Mobile Documents/com~apple~CloudDocs/Documents/Notes"
if [ -d "$file" ]; then
  logfile="$LOGDIR/notes.log"
  gitwatch -r origin -R "$file" >"$logfile" 2>&1 &
  echo "Running syncengine on $file and logging to $logfile"
fi

wait
''']
run_at_load = true
# Start at login; no automatic restart after exit.
environment = { HOME = "{{ env.HOME }}", PATH = "{{ vars.syncengine_path }}" }
stdout_path = "~/.local/state/com.codethread.syncengine/std.log"
stderr_path = "~/.local/state/com.codethread.syncengine/std.log"
