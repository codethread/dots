[vars]
service_profile = "dev"
claude_work_machine = false
git_maintenance_repositories = "~/dev/projects/notes/vault"

[bootstrap.packages]
"brew:dos2unix" = { os = "macos" }
"brew:podman" = { os = "macos" }
"brew:podman-compose" = { os = "macos" }
"brew-cask:terminal-browser" = { os = "macos" }

# Configure Apple's SSH server; Remote Login stays manual in System Settings.
[bootstrap.files."/etc/ssh/sshd_config.d/090-dots.conf"]
owner = "root"
group = "wheel"
mode = "0644"
content = '''
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers ct
'''

# Also declared globally in config/mise/config.dev.toml for use outside dots.
[tools]
"pypi:qmk" = "1.2.0"

[bootstrap.macos.launchd.agents.backup-notes]
program = "/bin/bash"
args = [
  "-c",
  '''
set -Eeuo pipefail

sentinel="$HOME/.local/state/com.codethread.backup-notes/failure-notified"

notify_failure() {
  local exit_code="$?"
  trap - ERR

  if [ ! -e "$sentinel" ]; then
    {
      echo "backup-notes failed with exit code $exit_code."
      echo
      echo "Repository: $HOME/dev/projects/notes/vault"
      echo
      /usr/bin/git -C "$HOME/dev/projects/notes/vault" status --short --branch || true
    } | "$HOME/.local/bin/cc-notify" "Notes git backup failed" || true
    : > "$sentinel"
  fi

  exit "$exit_code"
}

trap notify_failure ERR

cd "$HOME/dev/projects/notes/vault"

/usr/bin/git add -A
if ! /usr/bin/git diff --cached --quiet; then
  /usr/bin/git commit -m "auto: $(/bin/date -u +%Y-%m-%dT%H:%M:%SZ)"
fi

/usr/bin/git pull --rebase
/usr/bin/git push

/bin/rm -f "$sentinel"
''',
]
run_at_load = true
start_interval = 900
# Keep the old state directory so notification suppression survives the handoff.
environment = { HOME = "{{ env.HOME }}", PATH = "/usr/bin:/bin:/usr/sbin:/sbin" }
stdout_path = "~/.local/state/com.codethread.backup-notes/std.log"
stderr_path = "~/.local/state/com.codethread.backup-notes/std.log"
