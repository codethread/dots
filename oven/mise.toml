min_version = "2026.9.15"

# Runtimes only: Biome and TypeScript are installed from bun.lock.
[tools]
bun = "1.4.2"
node = "24.21.0"

# Do not activate or install unrelated parent/global workstation tools in Oven.
[settings]
enable_tools = ["bun", "node"]

# Require Oven's committed runtime artifact metadata.
[tool_config]
locked = true

[tasks.install]
description = "Install Oven dependencies from bun.lock"
run = "bun install --frozen-lockfile"

[tasks.verify]
description = "Test, typecheck, fix, build wrappers, and sync Oven docs"
depends = ["install"]
run = "bun run verify"
