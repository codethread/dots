project_doc_fallback_filenames = ["CLAUDE.md"]
cli_auth_credentials_store = "file"
sandbox_mode = "danger-full-access"
approval_policy = "never"
personality = "pragmatic"
model_reasoning_effort = "medium"
model = "gpt-5.6-terra"
approvals_reviewer = "user"
service_tier = "default"

[tui]
status_line = [
    "model-with-reasoning",
    "current-dir",
    "context-remaining",
    "weekly-limit",
    "used-tokens",
    "thread-id",
]
status_line_use_colors = true

[notice]
hide_rate_limit_model_nudge = true

[plugins."coding@agents"]
enabled = true

[plugins."devflow@agents"]
enabled = false

[plugins."writing@agents"]
enabled = true

[plugins."harness-skills@agents"]
enabled = true

[plugins."codex-harness@agents"]
enabled = true

[plugins."harness@agents"]
enabled = true

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."slack@openai-curated"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = false

[plugins."pdf@openai-primary-runtime"]
enabled = false

[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."template-creator@openai-primary-runtime"]
enabled = false

[plugins."sites@openai-bundled"]
enabled = false

[plugins."browser@openai-bundled"]
enabled = true

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
ambient-suggestions-enabled = false
mac-menu-bar-enabled = false
show-context-window-usage = true
composerEnterBehavior = "cmdAlways"
notifications-turn-mode = "off"
enabled-reasoning-efforts = [
    "low",
    "medium",
    "high",
    "xhigh",
]
followUpQueueMode = "queue"

[shell_environment_policy.filters]
_VOLTA_TOOL_RECURSION = "exclude"

[[skills.config]]
path = "~/.config/.codex/skills/.system/imagegen/SKILL.md"
enabled = false

[[skills.config]]
path = "~/.config/.codex/skills/.system/plugin-creator/SKILL.md"
enabled = false

[[skills.config]]
path = "~/.config/.codex/skills/.system/skill-creator/SKILL.md"
enabled = false

[[skills.config]]
path = "~/.config/.codex/skills/.system/review-agent/SKILL.md"
enabled = false

[[skills.config]]
path = "~/.config/.codex/skills/.system/skill-installer/SKILL.md"
enabled = false
