# Preserve the API-compatible codethread fork, not Homebrew's upstream CLI.
[bootstrap.repos."~/dev/vendor/todoist"]
url = "https://github.com/codethread/todoist.git"
ref = "5d1c6df1a86729b193840d988fb38fa654b93bb9"

[tasks."packages:todoist"]
description = "Build the pinned Todoist fork with mise Go"
shell = "/bin/bash -c"
run = '''
set -euo pipefail
mise bootstrap repos update "$HOME/dev/vendor/todoist" --yes
mkdir -p "$HOME/.local/bin"
cd "$HOME/dev/vendor/todoist"
# The fork commits its generated filter_parser.go; no goyacc bootstrap needed.
go build -trimpath -o "$HOME/.local/bin/todoist" .
'''
