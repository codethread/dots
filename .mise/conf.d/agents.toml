[bootstrap.repos."~/dev/projects/agents"]
url = "git@github.com:codethread/agents.git"

# Pi's repo-owned settings already load this checkout as a local package.
[tasks."agents:update"]
description = "Clone/update agents, install dependencies, and link pi/pies (requires a clean checkout)"
run = [
  'mise bootstrap repos update "{{ env.HOME }}/dev/projects/agents" --yes',
  'pnpm --dir "{{ env.HOME }}/dev/projects/agents" install --frozen-lockfile',
  'pnpm --dir "{{ env.HOME }}/dev/projects/agents" run link:pi',
]
