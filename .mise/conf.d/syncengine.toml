[vars]
syncengine_path = "{{ env.HOME }}/.local/bin:/opt/homebrew/opt/coreutils/libexec/gnubin:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/bin:/bin:/usr/sbin:/sbin"

[tasks."syncengine:prepare"]
description = "Check gitwatch dependencies and create syncengine logs before launchd loads"
shell = "/bin/bash -c"
run = '''
set -euo pipefail
export PATH="{{ vars.syncengine_path }}"
[ "$(uname -s)" = Darwin ] || { echo 'syncengine requires macOS' >&2; exit 1; }
for cmd in bash git gitwatch fswatch greadlink; do
  command -v "$cmd" >/dev/null || {
    echo "Missing syncengine dependency: $cmd. Run packages:apply and repositories:apply first." >&2
    exit 1
  }
done
mkdir -p "$HOME/.local/state/com.codethread.syncengine"
'''

[tasks."syncengine:apply"]
description = "Prepare and apply only syncengine (all macOS profiles)"
depends = ["syncengine:prepare"]
shell = "/bin/bash -c"
run = '''
set -euo pipefail
if /bin/launchctl print "gui/$(/usr/bin/id -u)/com.codethread.syncengine" >/dev/null 2>&1; then
  echo "Old Nix agent still loaded: com.codethread.syncengine. Switch the updated Nix configuration before applying mise services." >&2
  exit 1
fi
# Limit project declarations to this fragment; other services require dev/work.
MISE_OVERRIDE_CONFIG_FILENAMES="{{ config_root }}/.mise/conf.d/syncengine.toml" mise bootstrap macos launchd-agents apply --yes
'''

[tasks."syncengine:status"]
description = "Show only the syncengine LaunchAgent state (all macOS profiles)"
env.MISE_OVERRIDE_CONFIG_FILENAMES = "{{ config_root }}/.mise/conf.d/syncengine.toml"
run = "mise bootstrap macos launchd-agents status"

[bootstrap.macos.launchd.agents.syncengine]
program = "/bin/bash"
args = ["-c", '''
echo "Starting sync"

directory="$HOME/sync"

LOGDIR="$HOME/.local/state/com.codethread.syncengine"
mkdir -p "$LOGDIR"
mkdir -p "$directory"

# Loop over each file in the directory
if [ -d "$directory" ]; then
  for file in "$directory"/*; do
    logfile="$LOGDIR/${file##*/}.log"
    gitwatch -r origin -R "$file" >"$logfile" 2>&1 &
    echo "Running syncengine on $file and logging to $logfile"
  done
fi

file="$HOME/Library/Mobile Documents/com~apple~CloudDocs/Documents/Notes"
if [ -d "$file" ]; then
  logfile="$LOGDIR/notes.log"
  gitwatch -r origin -R "$file" >"$logfile" 2>&1 &
  echo "Running syncengine on $file and logging to $logfile"
fi

wait
''']
run_at_load = true
# Preserve the old RunAtLoad-only policy: no automatic restart after exit.
environment = { HOME = "{{ env.HOME }}", PATH = "{{ vars.syncengine_path }}" }
stdout_path = "~/.local/state/com.codethread.syncengine/std.log"
stderr_path = "~/.local/state/com.codethread.syncengine/std.log"
