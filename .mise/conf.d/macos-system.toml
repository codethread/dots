# Apple-supported sudo extension point (macOS 14+). Leave /etc/pam.d/sudo alone.
# https://support.apple.com/en-us/109030
# https://github.com/fabianishere/pam_reattach
[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.files."/etc/pam.d/sudo_local"]
owner = "root"
group = "wheel"
mode = "0644"
# Deliberately do not replace symlinks: retire nix-darwin before applying.
content = '''
# Managed by dots/mise; optional reattach enables Touch ID inside tmux/screen.
auth       optional       /opt/homebrew/lib/pam/pam_reattach.so
auth       sufficient     pam_tid.so
'''

[tasks."system:apply"]
description = "Apply the macOS login shell and Touch ID sudo (requires packages:apply)"
shell = "/bin/bash -c"
run = '''
set -euo pipefail
[ "$(uname -s)" = Darwin ] || { echo 'system:apply requires macOS' >&2; exit 1; }
[ -f /etc/pam.d/sudo_local.template ] || { echo 'Touch ID setup requires macOS 14 or newer' >&2; exit 1; }
if [ -L /etc/pam.d/sudo_local ]; then
  echo 'sudo_local is a symlink; retire its previous owner first (docs/mise.md#retiring-nix)' >&2
  exit 1
fi
/usr/bin/grep -Eq '^auth[[:space:]]+include[[:space:]]+sudo_local([[:space:]]|$)' /etc/pam.d/sudo || {
  echo 'Stock sudo_local include missing from /etc/pam.d/sudo; inspect the PAM stack before applying' >&2
  exit 1
}
[ -f /opt/homebrew/lib/pam/pam_reattach.so ] || { echo 'Missing pam-reattach; run packages:apply first' >&2; exit 1; }
mise bootstrap user apply --yes
MISE_ENV= MISE_OVERRIDE_CONFIG_FILENAMES="{{ config_root }}/.mise/conf.d/macos-system.toml" mise bootstrap files apply --yes
'''

[tasks."system:status"]
description = "Show login shell and Touch ID sudo configuration state"
run = [
  "mise bootstrap user status",
  'MISE_ENV= MISE_OVERRIDE_CONFIG_FILENAMES="{{ config_root }}/.mise/conf.d/macos-system.toml" mise bootstrap files status',
]
