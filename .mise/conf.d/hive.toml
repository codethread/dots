[bootstrap.repos."~/dev/projects/hive"]
url = "git@github.com:codethread/hive.git"

[tasks."hive:update"]
description = "Clone/update Hive and install Honeycomb (requires a clean checkout)"
run = [
  'mise bootstrap repos update "{{ env.HOME }}/dev/projects/hive" --yes',
  'bun install --cwd "{{ env.HOME }}/dev/projects/hive" --frozen-lockfile',
  'bun run --cwd "{{ env.HOME }}/dev/projects/hive" --filter @hive/honeycomb build',
]
