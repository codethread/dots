# Vendor-owned CLIs; mise orchestrates them rather than installing second copies.
[tasks."llm:install"]
description = "Install missing Claude, Cursor Agent, Codex, and Pi with official installers"
env.DOTFILES = "{{ config_root }}"
run = '"{{ config_root }}/home/.local/bin/mise-llm" install'

[tasks."llm:update"]
description = "Update Claude, Cursor Agent, Codex, Pi, and Pi npm extensions"
env.DOTFILES = "{{ config_root }}"
run = '"{{ config_root }}/home/.local/bin/mise-llm" update'
