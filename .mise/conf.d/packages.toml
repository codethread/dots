[bootstrap.plugins]
vscode = "https://github.com/waynehoover/mise-vscode"

[bootstrap.brew.taps]
"codethread/qlock" = "https://github.com/codethread/qlock"
"codethread/wktree" = "https://github.com/codethread/wktree"
"codethread/chatty" = "https://github.com/codethread/Chatty.app"

# Shared macOS host packages. Apply explicitly; never prune during bootstrap.
[bootstrap.packages]
# Shared CLI packages.
# python-yq is the jq wrapper; tree-sitter-cli is the parser generator.
"brew:nushell" = { os = "macos" }
