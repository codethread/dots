# Shared macOS host packages. Apply explicitly; never prune during bootstrap.
[bootstrap.brew.taps]
"codethread/wktree" = "https://github.com/codethread/wktree"

[bootstrap.packages]
# Shared CLI packages.
# python-yq is the jq wrapper; tree-sitter-cli is the parser generator.
"brew:nushell" = { os = "macos" }
